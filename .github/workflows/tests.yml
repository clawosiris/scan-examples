name: tests

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      full_scan:
        description: Run e2e in scan-complete mode and wait for the scan to fully finish; disables the no-findings idle timeout
        type: boolean
        default: false
      completion_mode:
        description: e2e completion mode when full_scan is false
        type: choice
        options:
          - first-results
          - scan-complete
        default: first-results
      results_timeout:
        description: Maximum seconds to wait for e2e results/completion
        type: string
        default: '1800'
      no_findings_increment_timeout:
        description: Seconds without finding-count growth before stopping scan-complete runs; 0 disables
        type: string
        default: '1500'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.11'
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Sync package + test deps
        run: uv sync --locked --extra dev
      - name: Run unit tests
        run: uv run pytest
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Build Rust enrichment package
        run: cargo build --locked -p scan-enrichment

  mock-smoke:
    needs: unit
    runs-on: ubuntu-latest
    env:
      # Pinned to the released mock artifact so fast scanner-facing CI does not
      # drift with a moving :latest tag. Update this deliberately after reading
      # the mock scanner release notes.
      OPENVAS_MOCK_SCANNER_IMAGE: ghcr.io/clawosiris/openvas-mock-scanner:0.2.1
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Sync package + test deps
        run: uv sync --locked --extra dev
      - name: Pull published mock-scanner image
        run: docker pull "$OPENVAS_MOCK_SCANNER_IMAGE"
      - name: Run mock-server smoke tests
        run: uv run pytest tests/test_mock_server_smoke.py

  e2e:
    needs: [unit, mock-smoke]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: [self-hosted, Linux, X64, hetzner-vps-scan-examples, scan-examples-e2e]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Show Docker environment
        run: |
          docker --version
          docker compose version
      - name: Create artifact directory
        run: mkdir -p artifacts
      - name: Build fresh example service image
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build --pull example
      - name: Synchronize Greenbone feed data
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up greenbone-feed-sync
      - name: Start scanner stack and target
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          gpg-data
          redis-server
          configure-openvas
          openvasd
          target
      - name: Run end-to-end custom scan config test
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.full_scan }}" == "true" ]]; then
            completion_mode="scan-complete"
            results_timeout="${{ inputs.results_timeout }}"
            no_findings_increment_timeout="0"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            completion_mode="${{ inputs.completion_mode }}"
            results_timeout="${{ inputs.results_timeout }}"
            no_findings_increment_timeout="${{ inputs.no_findings_increment_timeout }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            completion_mode="scan-complete"
            results_timeout="5400"
            no_findings_increment_timeout="1500"
          else
            completion_mode="first-results"
            results_timeout="1800"
            no_findings_increment_timeout="0"
          fi
          min_results="1000"
          echo "Using e2e completion mode: ${completion_mode}"
          echo "Using minimum first-results count: ${min_results}"
          echo "Using no-findings-increment timeout: ${no_findings_increment_timeout}s"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm \
            -v "$PWD/artifacts:/artifacts" \
            -e SCAN_CONFIG_JSON=/app/scanconfigs/scanconfig-modified.json.zip \
            -e E2E_COMPLETION_MODE="${completion_mode}" \
            -e E2E_MIN_RESULTS="${min_results}" \
            -e E2E_NO_FINDINGS_INCREMENT_TIMEOUT="${no_findings_increment_timeout}" \
            example e2e --host target \
              --wait-before-results 45 \
              --results-timeout "${results_timeout}" \
              --results-poll-interval 30 \
              --output /artifacts/scan-results.json
      - name: Collect compose logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > artifacts/docker-compose.log
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-examples-e2e-artifacts
          path: artifacts/
      - name: Tear down stack but keep feed volumes cached
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down --remove-orphans
          docker volume rm -f \
            scan-examples_redis_socket_vol \
            scan-examples_openvas_data_vol \
            scan-examples_openvas_log_data_vol || true
