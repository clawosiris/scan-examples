name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Sync lint deps
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Run lint
        run: uv run ruff check src tests
